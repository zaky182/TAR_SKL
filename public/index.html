<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAR System – PT Harapan Mitra Lestari</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--navy:#1E3A8A;--navy-d:#172c68;--blue:#2563EB;--bg:#F8FAFC;--card:#FFFFFF;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --draft:#6B7280;--sub:#D97706;--app:#059669;--rej:#DC2626;--shadow:0 1px 3px rgba(0,0,0,.1);--sbw:260px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%)}
.login-card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:32px 28px;width:100%;max-width:400px}
.login-card .logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-card .logo img{width:60px;height:auto}
.login-copy{margin:18px 0 0;font-size:12px;line-height:1.4;color:rgba(255,255,255,.75);text-align:center}
.login-card h1{font-size:20px;color:var(--navy)}
.login-card p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* ---------- form controls ---------- */
label.fl{display:block;font-weight:600;font-size:13px;margin:0 0 4px;color:#1e293b}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-height:42px}
textarea.inp{resize:vertical;min-height:96px}
.inp:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;min-height:42px;transition:filter .15s}
.btn:hover{filter:brightness(.93)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.navy{background:var(--navy)}.btn.green{background:var(--app)}.btn.red{background:var(--rej)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cbd5e1}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn-ico{border:1px solid var(--line);background:#fff;border-radius:6px;width:34px;height:34px;cursor:pointer;color:var(--navy)}
.btn-ico:hover{background:#eff6ff}.btn-ico.del{color:var(--rej)}
.field{margin-bottom:14px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:60;transition:width .2s,transform .2s;border-radius:0 18px 18px 0;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:12px;padding:18px 16px;min-height:80px}
.sb-logo{background:#fff;border-radius:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.sb-logo img{width:36px}
.sb-title b{display:block;font-size:16px;letter-spacing:.3px}.sb-title small{font-size:11px;opacity:.85}
.sb-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.sb-nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;color:#e0e7ff;text-decoration:none;font-weight:600;white-space:nowrap}
.sb-nav a i{width:22px;text-align:center;font-size:17px}
.sb-nav a:hover{background:rgba(255,255,255,.1)}
.sb-nav a.active{background:var(--blue);color:#fff}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.15)}
.sb-user{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sb-user .av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;cursor:pointer}
.sb-user .av img,.av-big img{width:100%;height:100%;object-fit:cover;display:block}
.sb-user .av:hover{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.av-big{width:120px;height:120px;border-radius:50%;border:4px solid var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--navy);background:#f1f5f9}
.sb-user b{display:block;font-size:14px;line-height:1.2}.sb-user small{opacity:.85}
.sb-btns{display:flex;gap:8px}
.sb-btns button{flex:1;border:0;border-radius:6px;padding:8px;background:#e2e8f0;color:var(--navy);font-weight:600;cursor:pointer;white-space:nowrap}
#backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55;display:none}
#main{flex:1;margin-left:var(--sbw);min-width:0;transition:margin .2s}
body.collapsed{--sbw:76px}
body.collapsed .sb-title,body.collapsed .sb-nav a span,body.collapsed .sb-user div,body.collapsed .sb-btns span{display:none}
body.collapsed .sb-nav a{justify-content:center;padding:12px 0}
body.collapsed .sb-btns{flex-direction:column}
body.collapsed .sb-user{justify-content:center}
.topbar{position:sticky;top:0;z-index:40;background:rgba(248,250,252,.95);backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line)}
.burger{background:none;border:0;font-size:22px;color:#0f172a;cursor:pointer;padding:6px 8px}
.topbar h1{font-size:22px;color:var(--navy);flex:1}
.bell{position:relative;background:none;border:0;font-size:22px;color:var(--navy);cursor:pointer;padding:6px 8px}
.bell .badge{position:absolute;top:0;right:0;background:var(--rej);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
#notifPanel{position:fixed;right:20px;top:60px;width:340px;max-width:calc(100vw - 24px);background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:70;overflow:hidden}
#notifPanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
#notifPanel .list{max-height:380px;overflow:auto}
.nitem{padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
.nitem.unread{background:#eff6ff}.nitem small{color:var(--muted);display:block;margin-top:2px}
.nitem:hover{background:#f1f5f9}
#view{padding:24px}

/* ---------- komponen ---------- */
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;color:var(--navy);margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.pill-title{background:#e5e7eb;border-radius:6px;padding:4px 12px;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;border-left:4px solid var(--navy)}
.kpi small{color:var(--muted);font-weight:600}.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi.draft{border-color:var(--draft)}.kpi.sub{border-color:var(--sub)}.kpi.app{border-color:var(--app)}.kpi.rej{border-color:var(--rej)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.chart-box{position:relative;height:300px}
.badge-st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.st-draft{background:var(--draft)}.st-sub{background:var(--sub)}.st-gl{background:var(--blue)}.st-app{background:var(--app)}.st-rej{background:var(--rej)}

.tbl-tools{display:flex;gap:10px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;min-width:820px;background:#fff}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{background:#f1f5f9;font-weight:700;white-space:nowrap;color:#1e293b}
.tbl tr.frow th{background:#f8fafc;padding:6px 8px}
.tbl tr.frow input,.tbl tr.frow select{width:100%;padding:5px 7px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-weight:400;min-width:70px}
.tbl tbody tr:hover{background:#f8fafc}
.tbl td.c{text-align:center}
.own{display:flex;align-items:center;gap:8px}
.ava{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:#e2e8f0;border:1px solid #cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#64748b}
.tbl-foot{margin-top:8px;color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--navy);border-color:var(--blue)}

/* ---------- form TAR ---------- */
.fsec{margin-bottom:20px}
.fsec h2{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--navy);margin-bottom:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.unit-info{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #93c5fd;background:#eff6ff;color:var(--navy);border-radius:12px;padding:22px;cursor:pointer;text-align:center;font-weight:600}
.dz i{font-size:34px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph img{width:100%;height:120px;object-fit:cover;display:block;background:#e2e8f0;cursor:zoom-in}
.ph .b{padding:8px;display:flex;gap:6px}.ph .b input{flex:1;min-width:0;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px}
.formbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.formbar .gl{flex:1;min-width:220px;max-width:340px}
.formbar .acts{display:flex;gap:12px;margin-left:auto}
.banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:12px 14px;margin-bottom:16px}

/* ---------- modal detail ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:900px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);z-index:2}
.dh{padding:20px 24px;border-bottom:1px solid var(--line);padding-right:50px}
.dh h2{font-size:18px;color:var(--navy);margin-bottom:6px}
.db{padding:20px 24px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-bottom:16px}
.kv small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.sect{margin-bottom:16px}.sect h3{font-size:14px;color:var(--navy);margin-bottom:6px}
.sect .tx{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.scorebox{display:flex;gap:10px;flex-wrap:wrap}
.scorebox div{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:8px 14px;text-align:center}
.scorebox b{display:block;font-size:20px;color:var(--app)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0 8px 14px;border-left:3px solid var(--blue);margin-left:6px;position:relative}
.log small{color:var(--muted)}
.da{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 14px 14px}
.da .btn{flex:0 1 auto}
.sw-form{text-align:left}.sw-form label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
.sw-form .inp{margin:0}

/* ---------- cetak A4 (mengikuti sketsa Report_Cetak) ---------- */
#printArea{display:none}
@page{size:A4;margin:12mm 12mm 18mm 12mm;@bottom-right{content:"Hal " counter(page) " / " counter(pages);font-size:7pt;color:#555;width:20%;text-align:right;vertical-align:top}}
@media print{
  html,body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font-family:Inter,Arial,sans-serif;font-size:10pt;line-height:1.45}
  .pa-blk,.pa-sign,.pa-ph{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pa-head{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid #222}
.pa-head img{height:46px}
.pa-head .co b{display:block;font-size:13pt;color:#1E3A8A}.pa-head .co span{font-size:10pt;font-weight:700;color:#1E3A8A}.pa-head .co span.pa-js{font-size:9.5pt;font-weight:500}
.pa-head .no{margin-left:auto;text-align:right;font-weight:700;color:#1E3A8A;font-size:11.5pt;line-height:1.5}
.pa-st{display:inline-block;border:1.5px solid currentColor;border-radius:999px;padding:1px 14px;font-weight:700;font-size:10.5pt;line-height:1.5}
.pa-st-Approved{color:#059669;background:#ecfdf5}.pa-st-Submitted{color:#EA580C;background:#fff7ed}.pa-st-Rejected{color:#DC2626;background:#fef2f2}.pa-st-Draft{color:#6B7280;background:#f3f4f6}
.pa-unit{padding:10px 0 12px;border-bottom:1px solid #222}
.pa-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px}
.pa-unit .pa-f.full{margin-top:8px}
.pa-f b{display:block;font-size:9pt;margin-bottom:2px}
.pa-f div{background:#e5e7eb;border-radius:4px;padding:4px 8px;min-height:7mm;word-break:break-word}
.pa-blk{margin-top:10px}.pa-blk b{display:block;font-size:9.5pt;margin-bottom:2px}
.pa-blk .tx{background:#e5e7eb;border-radius:5px;padding:8px 10px;white-space:pre-wrap;min-height:16mm}
.pa-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.pa-ph{text-align:center}.pa-ph img{width:100%;height:38mm;object-fit:contain;border-radius:5px;background:#f1f5f9;border:1px solid #cbd5e1;display:block}.pa-ph div{font-size:8pt;margin-top:2px}
.pa-sec-line{border-top:1px solid #222;margin-top:14px}
.pa-sign{display:flex;justify-content:space-around;gap:16px;padding-top:12px;text-align:center}
.pa-sign .box{width:46%}.pa-sign .box>b{display:block;font-size:10pt;margin-bottom:4px}
.pa-sign .qr{background:#fff;padding:2mm;border-radius:3px;line-height:0}
.pa-sign .qr svg{width:22mm;height:22mm}.pa-sign .vf{font-size:7pt;color:#555}
.pa-sign .sig{background:#e5e7eb;border-radius:5px;padding:8px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;text-align:left}
.pa-sign .meta{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.esign{display:inline-block;border:2px solid #1E3A8A;color:#1E3A8A;border-radius:6px;padding:2px 10px;font-weight:700;font-size:8.5pt;transform:rotate(-3deg);background:#fff}
.esign.wait{border-color:#999;color:#777}
.pa-sign small{font-size:8.5pt}

/* ---------- form & cetak SKL (mengikuti template PDF) ---------- */
.skl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1024px){.skl-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:768px){.skl-grid{grid-template-columns:1fr}}
.skl-review-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:14px 16px;margin-top:14px}
.skl-review-box h3{font-size:14px;color:var(--navy);margin:0 0 8px}

.skl-sheet{border:2.6pt solid #000;padding:8mm 10mm 7mm 10mm;font-family:'Times New Roman',Times,serif;color:#000;background:#fff;box-sizing:border-box;min-height:267mm;display:flex;flex-direction:column}
.skl-hd{display:flex;align-items:center;gap:14px;margin-bottom:4mm}
.skl-hd img{height:18mm;width:auto;object-fit:contain}
.skl-hd .co{flex:1;text-align:center;font-family:Calibri,Arial,sans-serif;font-size:19pt;font-weight:400;letter-spacing:.3px;padding-right:10mm}
.skl-title{text-align:center;font-family:'Times New Roman',Times,serif;font-size:21pt;font-weight:700;margin:2mm 0 7mm;letter-spacing:.2px}
.skl-meta{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 10mm;font-size:12pt;margin-bottom:7mm}
.skl-row{display:flex;align-items:baseline;gap:4px}
.skl-row .k{width:28mm;flex:none}
.skl-row .c{width:3mm;flex:none}
.skl-row .v{flex:1;border-bottom:1pt dotted #000;min-height:5.5mm;padding:0 2px;line-height:1.25}
.skl-sec{margin-bottom:6mm}
.skl-sec-h{font-size:12pt;font-weight:700;text-decoration:underline;margin-bottom:2mm}
.skl-sec-h.it{font-style:italic}
.skl-lines{position:relative;font-size:11.5pt;line-height:7.5mm;min-height:30mm;white-space:pre-wrap;word-break:break-word;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(7.5mm - 0.7pt),#000 calc(7.5mm - 0.7pt),#000 7.5mm);
  background-size:100% 7.5mm;padding-top:.4mm}
.skl-check-hd{font-size:12pt;font-weight:700;margin:2mm 0 2.5mm}
.skl-gl-row{display:flex;align-items:baseline;gap:4px;font-size:12pt;margin-bottom:3mm;width:54%}
.skl-gl-row .k{width:26mm;flex:none}
.skl-gl-row .c{width:3mm;flex:none}
.skl-gl-row .v{flex:1;border-bottom:0.8pt solid #000;min-height:5.5mm;padding:0 2px}
.skl-cbs{display:flex;justify-content:center;gap:24mm;margin:5mm 0 6mm;font-size:12pt}
.skl-cb{display:inline-flex;align-items:center;gap:3.5mm}
.skl-box{display:inline-flex;align-items:center;justify-content:center;width:7mm;height:5.5mm;border:1.6pt solid #000;font-size:13pt;font-weight:700;line-height:1}
.skl-sig-top{display:grid;grid-template-columns:2fr 1fr;font-size:12pt;margin:4mm 0 2mm}
.skl-sig-top div:first-child{padding-left:14mm}
.skl-sig-top div:last-child{text-align:center}
.skl-sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;align-items:end;margin-top:2mm}
.skl-sig-col{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:38mm;justify-content:flex-end}
.skl-sig-col.left{align-items:flex-start;text-align:left}
.skl-qr{line-height:0;margin-bottom:1.5mm}
.skl-qr svg{width:21mm;height:21mm}
.skl-ts{font-size:8.5pt;line-height:1.2;margin-bottom:1mm}
.skl-nm{font-size:10.5pt;font-weight:700;line-height:1.2;margin-bottom:1.5mm}
.skl-sig-line{width:38mm;border-top:1.2pt solid #000;padding-top:1mm;font-size:11.5pt;line-height:1.25}
.skl-sig-col.left .skl-sig-line{width:34mm}
.skl-foot{margin-top:auto;padding-top:7mm;font-size:10.5pt;line-height:1.45}
.skl-foot table{border-collapse:collapse;width:100%}
.skl-foot td{padding:0.4mm 0;vertical-align:top}
.skl-foot td.b{width:6mm}
.skl-foot td.k{width:24mm}

/* ---------- pop up (balon pesan) ---------- */
#popup{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(2px)}
.bubble{--bc:#031E7A;position:relative;background:#fff;border:8px solid var(--bc);border-radius:28px 28px 28px 0;width:100%;max-width:520px;min-width:260px;margin-bottom:48px;font-family:Roboto,Arial,sans-serif;box-shadow:0 8px 30px rgba(3,30,122,.18)}
.bubble::before,.bubble::after{content:"";position:absolute;left:-8px;top:100%;width:48px;height:48px}
.bubble::before{background:var(--bc);clip-path:polygon(0 0,100% 0,0 100%)}
.bubble::after{background:#fff;clip-path:polygon(8px 0,36.7px 0,8px 28.7px)}
.bubble-tx{padding:30px 34px;font-size:20px;line-height:1.45;color:#000;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}
.bubble-user{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 30px 0}
.bubble-user img,.bubble-user .ph-none{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid #031E7A;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:48px;color:#031E7A}
.bubble-user b{font-size:20px;text-align:center;color:#000}
.bubble-user+.bubble-tx{padding-top:14px;text-align:center}
.bubble-x{position:absolute;top:-22px;right:-22px;width:38px;height:38px;border-radius:50%;border:3px solid #FF0000;background:#fff;color:#FF0000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0}
.bubble-x:hover{background:#fee2e2}

/* ---------- cek kemiripan ---------- */
.sw{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span{position:relative;width:46px;height:26px;border-radius:999px;background:#cbd5e1;transition:background .15s;flex:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw input:checked+span{background:var(--app)}.sw input:checked+span::after{left:23px}
.sw input:focus-visible+span{outline:2px solid #93c5fd;outline-offset:2px}
.sim-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sim-note{font-size:12px;color:var(--muted);margin:6px 0 10px}
.sim-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sim-row.exact{border-color:#fca5a5;background:#fef2f2}.sim-row.warn{border-color:#fdba74;background:#fff7ed}
.sim-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sim-bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:8px 0 6px}.sim-bar i{display:block;height:100%}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:#eef2ff;color:#1e3a8a;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.sim-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
.cmp h4{margin:0 0 4px;font-size:13px;color:var(--navy)}
.cmp .tx{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-height:260px;overflow:auto;margin-bottom:10px}
mark{background:#fde68a;border-radius:2px;padding:0 1px}
@media (max-width:768px){.cmp{grid-template-columns:1fr}}

/* ---------- responsif ---------- */
@media (max-width:1024px){
  body{--sbw:76px}
  body.sb-open-wide #sidebar{width:260px;box-shadow:0 0 30px rgba(0,0,0,.35)}
  body:not(.sb-open-wide) .sb-title,body:not(.sb-open-wide) .sb-nav a span,body:not(.sb-open-wide) .sb-user div,body:not(.sb-open-wide) .sb-btns span{display:none}
  body:not(.sb-open-wide) .sb-nav a{justify-content:center;padding:12px 0}
  body:not(.sb-open-wide) .sb-btns{flex-direction:column}
  body:not(.sb-open-wide) .sb-user{justify-content:center}
  .grid5{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  body,body.collapsed{--sbw:270px}
  #sidebar{transform:translateX(-105%);width:270px}
  body.sb-open #sidebar{transform:none}
  body.sb-open #backdrop{display:block}
  #sidebar .sb-title,#sidebar .sb-nav a span,#sidebar .sb-user div,#sidebar .sb-btns span{display:revert!important}
  #sidebar .sb-nav a{justify-content:flex-start!important;padding:14px!important}
  #sidebar .sb-btns{flex-direction:row!important}#sidebar .sb-user{justify-content:flex-start!important}
  #main{margin-left:0}
  .topbar{padding:10px 12px}.topbar h1{font-size:18px}
  #view{padding:14px 12px 96px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .grid5{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .frow{display:none}
  .formbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;margin:0;z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  .formbar .gl{flex:1 1 100%;max-width:none}
  .formbar .acts{margin:0;width:100%}.formbar .acts .btn{flex:1;min-height:52px;font-size:15px}
  .da .btn{flex:1 1 100%;min-height:54px;font-size:16px}
  .dh,.db{padding:16px}
  /* tabel menjadi kartu */
  table.tbl{min-width:0}.tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:6px solid var(--bg);padding:6px 0}
  .tbl td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;flex:none}
  .tbl td.c{text-align:right}
  .tbl-wrap{border:0}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="logo"><img src="/logo.png" alt="HML"><div><h1>TAR System</h1><p>Plant Dept · PT Harapan Mitra Lestari</p></div></div>
    <div class="field"><label class="fl" for="lu">Username (NRP)</label><input class="inp" id="lu" name="username" autocomplete="username" inputmode="numeric" required></div>
    <div class="field"><label class="fl" for="lp">Password</label><input class="inp" id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn navy block" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
    <div style="text-align:center;margin-top:14px"><a href="#" id="forgot" style="color:var(--blue);font-weight:600;text-decoration:none">Lupa password?</a></div>
  </form>
  <p class="login-copy">© 2026 Mubarak's Project · All Rights Reserved</p>
</div>

<!-- ===================== APLIKASI ===================== -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo"><img src="/logo.png" alt="HML"></div>
      <div class="sb-title"><b>PLANT DEPT</b><small>PT Harapan Mitra Lestari</small></div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="sb-user"><div class="av" id="uAv" title="Ganti foto profil" role="button" tabindex="0"><i class="fa-regular fa-user"></i></div><div><b id="uName">Nama User</b><small id="uRole">Role</small></div></div>
      <div class="sb-btns">
        <button id="btnPass" title="Ganti password"><i class="fa-solid fa-key"></i> <span>Password</span></button>
        <button id="btnOut" title="Keluar"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Keluar</span></button>
      </div>
    </div>
  </aside>
  <div id="backdrop"></div>
  <div id="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <h1 id="pageTitle">Dashboard TAR</h1>
      <button class="bell" id="bell" aria-label="Notifikasi"><i class="fa-solid fa-bell"></i><span class="badge" id="bellN" hidden>0</span></button>
    </header>
    <div id="notifPanel" hidden></div>
    <main id="view"></main>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box"><button class="modal-x" id="modalX" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button><div id="modalBody"></div></div></div>
<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   Helper umum
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Asia/Jakarta';
const todayJkt = () => new Date().toLocaleDateString('sv-SE', { timeZone: TZ });
const fmtDate = (d) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '-');
const fmtFullDayDate = (d) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('id-ID', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '-');
const fmtTs = (t) => (t ? new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: TZ }) : '-');
const fmtSubmit = (t) => (t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', timeZone: TZ }) : '-');
const fmtTsDate = (t) => (t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric', timeZone: TZ }) : '-');
const toast = (icon, title) => Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2800, timerProgressBar: true });
const ST = { Draft: 'st-draft', Submitted: 'st-sub', 'Approved GL': 'st-gl', Approved: 'st-app', Rejected: 'st-rej' };
const badge = (s) => `<span class="badge-st ${ST[s] || ''}">${esc(s)}</span>`;

/** Pembungkus fetch: cookie sesi, header anti-CSRF, penanganan error seragam. */
async function api(url, o = {}) {
  const opt = { credentials: 'same-origin', method: o.method || 'GET', headers: { 'X-Requested-With': 'fetch' } };
  if ('json' in o) { opt.method = o.method || 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(o.json); }
  else if (o.body) { opt.method = o.method || 'POST'; opt.body = o.body; }
  const r = await fetch(url, opt);
  const data = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
  if (!r.ok) {
    if (r.status === 401 && S.user && !url.includes('/auth/')) { S.user = null; showLogin('Sesi berakhir, silakan login kembali.'); }
    const e = new Error((data && data.error) || 'Terjadi kesalahan'); e.details = data && data.details; e.status = r.status; throw e;
  }
  return data;
}
function showError(e, title = 'Gagal') {
  const list = e.details && e.details.length ? `<ul style="text-align:left;margin:8px 0 0 18px">${e.details.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : '';
  return Swal.fire({ icon: 'error', title, html: `<div>${esc(e.message)}</div>${list}`, confirmButtonColor: '#1E3A8A' });
}

/* =====================================================================
   State & navigasi
   ===================================================================== */
const S = { user: null, meta: null, charts: {}, poll: null, unread: 0 };
const MENUS = {
  'Mekanik': [['dashboard', 'fa-table-columns', 'Dashboard TAR'], ['input', 'fa-pen-to-square', 'Input TAR'], ['my', 'fa-clipboard-list', 'My TAR'], ['skl-input', 'fa-clock', 'Input SKL']],
  'Group Leader': [['dashboard', 'fa-table-columns', 'Dashboard TAR'], ['approval', 'fa-circle-check', 'Approval & Review'], ['search', 'fa-magnifying-glass', 'Search TAR'], ['skl-approval', 'fa-file-signature', 'Review & Approval SKL']],
  'Super admin': [['dashboard', 'fa-table-columns', 'Dashboard TAR'], ['admin', 'fa-user-shield', 'Admin Panel'], ['search', 'fa-magnifying-glass', 'Search TAR'], ['skl-approval', 'fa-file-signature', 'Review & Approval SKL']],
  'Admin': [['dashboard', 'fa-table-columns', 'Dashboard TAR'], ['admin', 'fa-user-shield', 'Admin Panel'], ['search', 'fa-magnifying-glass', 'Search TAR']],
};
const TITLES = {
  dashboard: 'Dashboard TAR', input: 'Input Laporan TAR', my: 'My TAR', approval: 'Approval & Review Panel',
  search: 'Search TAR', admin: 'Admin Panel', edit: 'Edit TAR (Admin)',
  'skl-input': 'Input SKL', 'skl-approval': 'Review & Approval SKL',
};

function showLogin(msg) {
  stopPoll(); closePopup(); S.popupShown = false;
  $('#app').hidden = true; $('#login').hidden = false;
  document.body.classList.remove('sb-open');
  if (msg) toast('info', msg);
  $('#lp').value = '';
}
async function startApp(user) {
  S.user = user; S.popupShown = false;
  S.meta = await api('/api/meta');
  $('#login').hidden = true; $('#app').hidden = false;
  $('#uName').textContent = user.nama_lengkap; $('#uRole').textContent = user.role + (user.jobsite ? ' · ' + user.jobsite : ''); renderAvatar();
  $('#nav').innerHTML = MENUS[user.role].map(([k, ic, t]) => `<a href="#/${k}" data-k="${k}"><i class="fa-solid ${ic}"></i><span>${t}</span></a>`).join('');
  if (innerWidth > 1024) document.body.classList.remove('collapsed');
  startPoll();
  router();
}
function router() {
  if (!S.user) return;
  const [name, arg] = (location.hash.replace(/^#\//, '') || 'dashboard').split('/');
  const allowed = MENUS[S.user.role].map((m) => m[0]);
  if (['Super admin', 'Admin'].includes(S.user.role)) allowed.push('edit');
  const key = allowed.includes(name) ? name : 'dashboard';
  if (key !== name) { location.hash = '#/dashboard'; return; }
  document.body.classList.remove('sb-open');
  $$('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.k === (key === 'edit' ? 'admin' : key)));
  $('#pageTitle').textContent = TITLES[key];
  Object.values(S.charts).forEach((c) => c && c.destroy()); S.charts = {};
  const pages = {
    dashboard: pageDashboard, input: pageInput, my: pageMy, approval: pageApproval, search: pageSearch, admin: pageAdmin,
    edit: (id) => pageInput(id, true), 'skl-input': pageSklInput, 'skl-approval': pageSklApproval,
  };
  $('#view').innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Memuat…</div>';
  Promise.resolve(pages[key](arg)).catch((e) => { $('#view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', router);

/* =====================================================================
   Tabel generik dengan filter per kolom + pencarian cepat
   cols: {label, text(row,i)->string utk filter, render(row,i)->html, filter:'text'|'select'|false, options:[...]}
   ===================================================================== */
function dataTable(host, cols, rows, opt = {}) {
  const fv = {}; let quick = '';
  const root = document.createElement('div'); host.replaceChildren(root);
  root.innerHTML = `
    <div class="tbl-tools"><input class="inp qs" placeholder="Cari cepat di semua kolom…" aria-label="Cari cepat"></div>
    <div class="tbl-wrap"><table class="tbl"><thead>
      <tr>${cols.map((c) => `<th>${c.label}</th>`).join('')}</tr>
      <tr class="frow">${cols.map((c, i) => `<th>${c.filter === 'select'
        ? `<select data-f="${i}"><option value="">Semua</option>${c.options.map((o) => `<option>${esc(o)}</option>`).join('')}</select>`
        : c.filter ? `<input data-f="${i}" placeholder="Filter…">` : ''}</th>`).join('')}</tr>
    </thead><tbody></tbody></table></div><div class="tbl-foot"></div>`;
  const tb = $('tbody', root), foot = $('.tbl-foot', root);
  const draw = () => {
    const q = quick.toLowerCase();
    const shown = rows.filter((r, ri) => cols.every((c, i) => {
      const v = (fv[i] || '').toLowerCase();
      if (!v || !c.filter) return true;
      const t = String(c.text(r, ri)).toLowerCase();
      return c.filter === 'select' ? t === v : t.includes(v);
    }) && (!q || cols.some((c) => c.text && String(c.text(r)).toLowerCase().includes(q))));
    tb.innerHTML = shown.length
      ? shown.map((r, i) => `<tr>${cols.map((c) => `<td data-label="${esc(c.mobile || c.label.replace(/<[^>]+>/g, ''))}" class="${c.cls || ''}">${c.render(r, i)}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}" class="empty">${opt.empty || 'Tidak ada data'}</td></tr>`;
    foot.textContent = `${shown.length} dari ${rows.length} laporan`;
  };
  root.addEventListener('input', (e) => {
    if (e.target.matches('.qs')) quick = e.target.value;
    else if (e.target.dataset.f != null) fv[e.target.dataset.f] = e.target.value.trim();
    else return;
    draw();
  });
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (b) opt.onAction && opt.onAction(b.dataset.act, b.dataset.id);
  });
  draw();
}
const actBtn = (act, id, icon, title, cls = '') => `<button class="btn-ico ${cls}" data-act="${act}" data-id="${id}" title="${title}" aria-label="${title}"><i class="fa-solid ${icon}"></i></button>`;
/** Nama owner + foto profil bulat kecil di sebelah kirinya. */
const ownerCell = (r) => `<span class="own">${r.owner_avatar_url ? `<img class="ava" src="${esc(r.owner_avatar_url)}" alt="" loading="lazy">` : '<span class="ava"><i class="fa-solid fa-user"></i></span>'}${esc(r.owner_name)}</span>`;
const scoreCell = (r) => (r.nilai_avg != null ? `<b>${r.nilai_avg}</b>${r.nilai_kronologis != null ? ` <small class="muted">(${r.nilai_kronologis}/${r.nilai_rootcause}/${r.nilai_action})</small>` : ''}` : '-');

/** Kolom standar dashboard & search (Nilai hanya Group Leader/Super admin). */
function reportCols({ withNo = true, withTar = false } = {}) {
  const c = [];
  if (withNo) c.push({ label: 'No', text: (r, i) => i + 1, render: (r, i) => i + 1, filter: false, cls: 'c' });
  c.push({ label: 'Tanggal', text: (r) => fmtSubmit(r.submitted_at), render: (r) => fmtSubmit(r.submitted_at), filter: 'text' });
  if (withTar) c.push({ label: 'No TAR', text: (r) => r.tar_number, render: (r) => `<span style="white-space:nowrap">${esc(r.tar_number)}</span>`, filter: 'text' });
  c.push(
    { label: 'Code Unit', text: (r) => r.code_unit || '', render: (r) => esc(r.code_unit || '-'), filter: 'text' },
    { label: 'Judul TAR', text: (r) => r.judul || '', render: (r) => esc(r.judul || '-'), filter: 'text' },
    { label: 'Komponen Terdampak', mobile: 'Komponen', text: (r) => r.komponen || '', render: (r) => esc(r.komponen || '-'), filter: 'text' },
    { label: 'Owner', text: (r) => r.owner_name, render: ownerCell, filter: 'text' },
    { label: 'Jobsite', text: (r) => r.jobsite || '', render: (r) => esc(r.jobsite || '-'), filter: 'select', options: S.meta.jobsites || [] },
    { label: 'Approval', text: (r) => r.status, render: (r) => badge(r.status), filter: 'select', options: ['Draft', 'Submitted', 'Approved', 'Rejected'] },
    { label: 'View', text: () => '', render: (r) => actBtn('view', r.id, 'fa-eye', 'Lihat detail'), filter: false, cls: 'c' });
  c.push({ label: 'Nilai', text: (r) => (r.nilai_avg != null ? r.nilai_avg : ''), render: scoreCell, filter: 'text' });
  return c;
}

/* =====================================================================
   Halaman: Dashboard
   ===================================================================== */
const PALETTE = ['#1E3A8A', '#2563EB', '#60A5FA', '#0EA5E9', '#14B8A6', '#059669', '#D97706', '#DC2626', '#7C3AED', '#64748B'];
async function pageDashboard() {
  maybePopup();
  $('#view').innerHTML = `
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="toolbar"><span class="pill-title">List TAR</span><span class="grow"></span>
        <label class="fl" style="margin:0" for="dm">Sortir by Month</label>
        <input type="month" class="inp" id="dm" style="width:auto">
        <button class="btn ghost sm" id="dmClear">Semua bulan</button>
        <button class="btn ghost sm" data-exp="csv"><i class="fa-solid fa-file-csv"></i> CSV</button>
        <button class="btn ghost sm" data-exp="xlsx"><i class="fa-solid fa-file-excel"></i> Excel</button>
      </div>
      <div id="dtbl"></div>
    </div>
    <div class="charts">
      <div class="card"><h2>Distribusi kerusakan by Model Unit</h2><div class="chart-box"><canvas id="c1"></canvas></div></div>
      <div class="card"><h2>Frekuensi kerusakan by Komponen</h2><div class="chart-box"><canvas id="c2"></canvas></div></div>
    </div>`;
  const month = () => $('#dm').value;
  const load = async () => {
    const m = month(), q = '?scope=all' + (m ? '&month=' + m : '');
    const [list, dash] = await Promise.all([api('/api/reports' + q), api('/api/dashboard' + q)]);
    dataTable($('#dtbl'), reportCols(), list.rows, { onAction: (a, id) => a === 'view' && openDetail(id), empty: 'Belum ada laporan pada periode ini' });
    const k = dash.kpi;
    $('#kpis').innerHTML = [['Total', k.Draft + k.Submitted + k.Approved + k.Rejected, ''], ['Submitted', k.Submitted, 'sub'], ['Approved', k.Approved, 'app'], ['Rejected', k.Rejected, 'rej']]
      .map(([l, n, c]) => `<div class="kpi ${c}"><small>${l}</small><b>${n}</b></div>`).join('');
    drawCharts(dash);
  };
  $('#dm').addEventListener('change', () => load().catch(showError));
  $('#dmClear').addEventListener('click', () => { $('#dm').value = ''; load().catch(showError); });

/** Perkecil foto besar di browser agar upload cepat (mobile); server tetap memvalidasi isi file. */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 500 * 1024) return file;
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch { return file; }
}
async function onPickFiles(e) {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    if (FORM.existing.length + FORM.pending.length >= 10) { toast('warning', 'Maksimal 10 foto'); break; }
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('error', `${f.name}: format harus JPG/PNG/WEBP`); continue; }
    const small = await shrink(f);
    if (small.size > 8 * 1048576) { toast('error', `${f.name}: lebih dari 8 MB`); continue; }
    FORM.pending.push({ file: small, caption: '', url: URL.createObjectURL(small) });
  }
  renderPhotos();
}
function removePhoto(kind, i) {
  if (kind === 'pending') { URL.revokeObjectURL(FORM.pending[i].url); FORM.pending.splice(i, 1); renderPhotos(); return; }
  const p = FORM.existing[i];
  Swal.fire({ title: 'Hapus foto ini?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus', cancelButtonText: 'Batal', confirmButtonColor: '#DC2626' })
    .then(async (r) => {
      if (!r.isConfirmed) return;
      try { await api('/api/photos/' + p.id, { method: 'DELETE' }); FORM.existing.splice(i, 1); renderPhotos(); } catch (er) { showError(er); }
    });
}
function renderPhotos() {
  const card = (p, i, k, src, remote) => `<div class="ph"><img src="${esc(remote ? src + '?s=thumb' : src)}" alt="Foto ${i + 1}" loading="lazy" ${remote ? `data-zoom="${esc(src)}"` : ''}>

  $('#photos').innerHTML = FORM.existing.map((p, i) => card(p, i, 'existing', p.url, true)).join('') + FORM.pending.map((p, i) => card(p, i, 'pending', p.url, false)).join('');

function collectForm() {

function clientValidate(b, strict) {
  const e = [];
  if (!b.judul) e.push('Judul TAR wajib diisi');
  if (b.hm_unit && !(Number(b.hm_unit) > 0)) e.push('HM unit harus angka positif');

      ['kronologi', 'Kronologi & deskripsi problem'], ['analisa', 'Analisa problem'], ['tindakan', 'Tindakan perbaikan & pencegahan'], ['leader_id', 'Group Leader tujuan']]
      .forEach(([k, l]) => { if (!b[k]) e.push(`${l} wajib diisi`); });
    if (FORM.existing.length + FORM.pending.length < 1) e.push('Minimal 1 foto kerusakan wajib diunggah');

/** Simpan draft atau submit: simpan data → unggah foto → (opsional) submit. */
async function saveReport(submit) {
  const body = collectForm(), strictAdmin = FORM.admin && FORM.status !== 'Draft', errs = clientValidate(body, submit || strictAdmin);
  if (errs.length) return showError({ message: 'Lengkapi data berikut:', details: errs }, 'Form belum lengkap');
  if (submit) {
    const r = await Swal.fire({ title: 'Submit TAR?', text: 'Laporan dikirim ke Group Leader dan tidak dapat diubah sampai direview.', icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, submit', cancelButtonText: 'Batal', confirmButtonColor: '#1E3A8A' });
    if (!r.isConfirmed) return;
  }
  if (FORM.admin && FORM.status !== 'Draft') {
    const r = await Swal.fire({ title: 'Simpan perubahan?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, simpan', cancelButtonText: 'Batal', confirmButtonColor: '#1E3A8A',
      text: FORM.status === 'Approved' ? 'TAR ini sudah Approved. Mengubah isinya membuat QR tanda tangan pada dokumen yang sudah dicetak menjadi tidak valid.' : 'Perubahan dicatat di audit trail dan pemilik TAR akan diberi notifikasi.' });
    if (!r.isConfirmed) return;
  }
  const btns = $$('#btnDraft,#btnSubmit,#btnSave'); btns.forEach((b) => (b.disabled = true));
  try {
    let id = FORM.id;
    if (id) await api((FORM.admin ? '/api/admin/reports/' : '/api/reports/') + id, { method: 'PUT', json: body });
    else { const r = await api('/api/reports', { json: body }); id = FORM.id = r.id; }
    for (const p of FORM.existing) if (p.caption !== p.orig) { await api('/api/photos/' + p.id, { method: 'PATCH', json: { caption: p.caption } }); p.orig = p.caption; }
    if (FORM.pending.length) {
      const fd = new FormData();
      FORM.pending.forEach((p) => { fd.append('files', p.file, p.file.name); fd.append('captions', p.caption || ''); });
      const r = await api(`/api/reports/${id}/photos`, { method: 'POST', body: fd });
      FORM.existing.push(...r.photos.map((p) => ({ ...p, caption: p.caption || '', orig: p.caption || '' })));
      FORM.pending.forEach((p) => URL.revokeObjectURL(p.url)); FORM.pending = []; renderPhotos();
    }
    if (submit) await api(`/api/reports/${id}/submit`, { method: 'POST', json: {} });
    toast('success', FORM.admin ? 'Perubahan TAR tersimpan' : submit ? 'TAR berhasil dikirim' : 'Draft tersimpan');
    location.hash = FORM.admin ? '#/admin' : '#/my';
  } catch (e) { showError(e, submit ? 'Gagal submit' : 'Gagal menyimpan'); }
  finally { btns.forEach((b) => (b.disabled = false)); }
}

/** Unduh semua TAR sesuai filter: 1 TAR = PDF, 2+ TAR = ZIP berisi PDF per TAR. */
async function downloadPdf(params) {
  const r = await Swal.fire({ title: 'Download TAR (PDF)', icon: 'question', showDenyButton: true, showCancelButton: true,
    html: '<p style="margin:0">TAR yang sesuai filter pada tabel akan diunduh. Satu TAR berupa file PDF; dua atau lebih dikemas dalam satu file ZIP.<br><br>Sertakan nilai penilaian?</p>',
    confirmButtonText: 'Dengan nilai', denyButtonText: 'Tanpa nilai', cancelButtonText: 'Batal', confirmButtonColor: '#1E3A8A', denyButtonColor: '#2563EB' });
  if (!r.isConfirmed && !r.isDenied) return;
  Swal.fire({ title: 'Menyiapkan file…', html: 'Mohon tunggu dan jangan tutup halaman ini.', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading() });
  try {
    const resp = await fetch(`/api/export/pdf?${params}&scores=${r.isConfirmed ? 1 : 0}`, { credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch' } });
    if (!resp.ok) {
      let msg = 'Gagal membuat file';
      try { msg = (await resp.json()).error || msg; } catch { /* bukan JSON */ }
      throw new Error(msg);
    }
    const blob = await resp.blob();
    const m = (resp.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = m ? m[1] : 'TAR-export.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    Swal.close(); toast('success', 'File berhasil diunduh');
  } catch (e) { showError(e, 'Download gagal'); }
}

/** Dialog Approve (catatan + 3 nilai 0–100) / Reject (catatan wajib). */
async function decide(r, action, done) {
  const approve = action === 'approve';
  const scoreIn = (id, l) => `<label for="${id}">${l} (0–100)</label><input id="${id}" class="swal2-input inp" type="number" min="0" max="100" step="1" inputmode="numeric">`;
  const res = await Swal.fire({
    title: approve ? 'Approve laporan' : 'Reject laporan', icon: approve ? 'question' : 'warning', showCancelButton: true, focusConfirm: false,
    confirmButtonText: approve ? 'Approve' : 'Reject', cancelButtonText: 'Batal', confirmButtonColor: approve ? '#059669' : '#DC2626',
    html: `<div class="sw-form">${approve ? scoreIn('sc1', 'a. Penjabaran kronologis') + scoreIn('sc2', 'b. Analisa akar masalah / root cause') + scoreIn('sc3', 'c. Pemilihan action / solusi') : ''}
      <label for="scn">${approve ? 'Catatan verifikasi' : 'Alasan penolakan (wajib)'}</label><textarea id="scn" class="swal2-textarea inp" rows="4" maxlength="5000" style="margin:0;width:100%"></textarea></div>`,
    preConfirm: () => {
      const out = { action, catatan: $('#scn').value.trim() };
      if (!out.catatan) return Swal.showValidationMessage(approve ? 'Catatan wajib diisi' : 'Alasan penolakan wajib diisi');
      if (approve) {
        for (const [k, id] of [['nilai_kronologis', 'sc1'], ['nilai_rootcause', 'sc2'], ['nilai_action', 'sc3']]) {
          const s = $('#' + id).value.trim();
          if (!/^\d{1,3}$/.test(s) || Number(s) > 100) return Swal.showValidationMessage('Ketiga nilai harus bilangan bulat 0–100');
          out[k] = Number(s);
        }
      }
      return out;
    },
  });
  if (!res.isConfirmed) return;
  try { await api(`/api/reports/${r.id}/decision`, { json: res.value }); toast('success', approve ? 'Laporan disetujui' : 'Laporan ditolak'); done(); }
  catch (e) { showError(e); }
}

const simColor = (score, w, e) => (score >= e ? '#DC2626' : score >= w ? '#D97706' : '#059669');

function simBadge(r) {
  if (r.sim_score == null) return '<span class="muted">-</span>';
  const cls = r.sim_level === 'exact' ? 'st-rej' : r.sim_level === 'warn' ? 'st-sub' : 'st-draft';
  const txt = r.sim_level === 'exact' ? `Sama persis ${r.sim_score}%` : r.sim_level === 'warn' ? `Mirip ${r.sim_score}%` : `${r.sim_score}%`;
  return `<span class="badge-st ${cls}">${txt}</span>`;
}
async function loadSimilarity(id, refresh) {
  const box = $('#simBox'); if (!box) return;
  box.innerHTML = '<h3>Cek Kemiripan</h3><div class="muted"><i class="fa-solid fa-spinner fa-spin"></i> Memeriksa kemiripan dengan TAR lain…</div>';
  try {
    const d = await api(`/api/reports/${id}/similarity${refresh ? '?refresh=1' : ''}`);
    if (!d.enabled) { box.remove(); return; }

/** Tandai potongan 3 kata berurutan yang sama di kedua teks. */
function markShared(a, b) {
  const nw = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  const prep = (s) => { const parts = String(s || '').split(/(\s+)/); const idx = []; parts.forEach((p, i) => { if (p && !/^\s+$/.test(p)) idx.push(i); }); return { parts, idx, n: idx.map((i) => nw(parts[i])) }; };
  const tris = (n) => { const set = new Set(); for (let i = 0; i + 2 < n.length; i++) if (n[i] && n[i + 1] && n[i + 2]) set.add(n[i] + ' ' + n[i + 1] + ' ' + n[i + 2]); return set; };
  const A = prep(a), B = prep(b), ta = tris(A.n), tb = tris(B.n);
  const render = (X, other) => {
    const hit = new Set();
    for (let k = 0; k + 2 < X.n.length; k++) if (X.n[k] && X.n[k + 1] && X.n[k + 2] && other.has(X.n[k] + ' ' + X.n[k + 1] + ' ' + X.n[k + 2])) { hit.add(k); hit.add(k + 1); hit.add(k + 2); }
    const idxPos = new Map(X.idx.map((pi, k) => [pi, k]));
    return X.parts.map((p, i) => (idxPos.has(i) && hit.has(idxPos.get(i)) ? `<mark>${esc(p)}</mark>` : esc(p))).join('');
  };
  return [render(A, tb), render(B, ta)];
}
async function simCompare(id, oid) {
  try {
    const { a, b } = await api(`/api/reports/${id}/similarity/compare/${oid}`);
    const sec = (label, k) => { const [x, y] = markShared(a[k], b[k]); return `<h4 style="grid-column:1/-1;margin:8px 0 0">${label}</h4><div class="tx">${x || '-'}</div><div class="tx">${y || '-'}</div>`; };
    await Swal.fire({ width: 'min(1100px, 96vw)', showCloseButton: true, showConfirmButton: false,
      html: `<div class="cmp"><div><h4>${esc(a.tar_number)} · ${esc(a.owner_name)}</h4><div class="muted" style="font-size:12px">${esc(a.judul || '')}</div></div>
        <div><h4>${esc(b.tar_number)} · ${esc(b.owner_name)}</h4><div class="muted" style="font-size:12px">${esc(b.judul || '')}</div></div>
        ${sec('Kronologi & Deskripsi Problem', 'kronologi')}${sec('Analisa Problem', 'analisa')}${sec('Tindakan Perbaikan & Pencegahan', 'tindakan')}</div>
        <div class="sim-note" style="text-align:left"><mark>Sorotan kuning</mark> = rangkaian kata yang sama di kedua TAR.</div>` });
  } catch (e) { showError(e); }
}
async function simExplain(id, oid) {
  Swal.fire({ title: 'Meminta penjelasan AI…', allowOutsideClick: false, showConfirmButton: false, didOpen: () => Swal.showLoading() });
  try {
    const d = await api(`/api/reports/${id}/similarity/explain`, { json: { other_id: Number(oid) } });
    Swal.fire({ title: 'Penjelasan AI', html: `<div style="text-align:left;white-space:pre-wrap;font-size:14px">${esc(d.text)}</div><div class="sim-note" style="text-align:left">Ringkasan otomatis oleh AI; periksa kembali dengan membandingkan kedua TAR.</div>`, confirmButtonColor: '#1E3A8A' });
  } catch (e) { Swal.close(); showError(e); }
}

        $('#skl_uraian').value = '';
        await loadList();
      }

  };

  await loadList();
}

/** Potong persegi dari tengah & perkecil ke 400x400 JPEG sebelum diunggah. */
async function cropSquare(file, size = 400) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  cv.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.88));
}

      <label class="btn ghost sm" for="avFile"><i class="fa-solid fa-image"></i> Pilih foto</label><input id="avFile" class="sr" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">Foto dipotong persegi dari tengah · JPG / PNG / WEBP</small></div>`,
    didOpen: () => {
      $('#avFile').addEventListener('change', async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { Swal.showValidationMessage('Format harus JPG, PNG, atau WEBP'); return; }
        try { blob = await cropSquare(f); $('#avPrev').innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="">`; Swal.resetValidationMessage(); }
        catch { Swal.showValidationMessage('Gambar tidak dapat dibaca'); }
      });
    },
    preConfirm: () => { if (!blob) { Swal.showValidationMessage('Pilih foto terlebih dahulu'); return false; } return blob; },
  });
  try {
    if (r.isConfirmed) {
      const fd = new FormData(); fd.append('file', r.value, 'avatar.jpg');
      const d = await api('/api/me/avatar', { method: 'POST', body: fd });
      S.user.avatar_url = d.avatar_url; renderAvatar(); toast('success', 'Foto profil diperbarui');
    } else if (r.isDenied) {
      await api('/api/me/avatar', { method: 'DELETE' });
      S.user.avatar_url = null; renderAvatar(); toast('success', 'Foto profil dihapus');
    }
  } catch (e) { showError(e); }
}
$('#uAv').addEventListener('click', changeAvatar);
$('#uAv').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); changeAvatar(); } });

/* =====================================================================
   Pop up (balon pesan) – isi diatur Super admin; tampil saat login/reload di Dashboard
   ===================================================================== */
function closePopup() { const o = $('#popup'); if (o) o.remove(); }
function showPopup(msg, user) {
  closePopup();
  const o = document.createElement('div'); o.id = 'popup';
  o.innerHTML = `<div class="bubble" role="dialog" aria-modal="true"><button class="bubble-x" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>${user ? `<div class="bubble-user">${user.avatar_url ? `<img src="${esc(user.avatar_url)}" alt="">` : '<div class="ph-none"><i class="fa-regular fa-user"></i></div>'}<b>${esc(user.nama)}</b></div>` : ''}<div class="bubble-tx">${esc(msg)}</div></div>`;
  document.body.appendChild(o);
  const onKey = (e) => { if (e.key === 'Escape') { closePopup(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  o.addEventListener('click', (e) => { if (e.target === o || e.target.closest('.bubble-x')) { closePopup(); document.removeEventListener('keydown', onKey); } });
  $('.bubble-x', o).focus();
}
/** Ditampilkan sekali per login / reload halaman, saat membuka Dashboard. */
function maybePopup() {
  if (S.popupShown) return;
  S.popupShown = true;
  api('/api/popup').then((d) => { if (d.enabled && d.message) showPopup(d.message, d.user); }).catch(() => {});
}

/* =====================================================================
   Notifikasi (polling 30 dtk + Web Notification bila diizinkan)
   ===================================================================== */
async function pollNotif(first) {
  try {
    const d = await api('/api/notifications');
    if (!first && d.unread > S.unread && 'Notification' in window && Notification.permission === 'granted') {
      const n = d.rows.find((x) => !x.is_read); if (n) new Notification('TAR System', { body: n.message, icon: '/logo.png' });
    }
    S.unread = d.unread; S.notifs = d.rows;
    $('#bellN').hidden = !d.unread; $('#bellN').textContent = d.unread > 99 ? '99+' : d.unread;
    if (!$('#notifPanel').hidden) renderNotif();
  } catch { /* abaikan error sementara */ }
}
function startPoll() { stopPoll(); pollNotif(true); S.poll = setInterval(() => pollNotif(false), 30000); }
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; S.unread = 0; $('#bellN').hidden = true; $('#notifPanel').hidden = true; }
function renderNotif() {
  const rows = S.notifs || [];
  $('#notifPanel').innerHTML = `<header><span>Notifikasi</span><button class="btn ghost sm" id="nAll">Tandai dibaca</button></header>
    <div class="list">${rows.length ? rows.map((n) => `<div class="nitem ${n.is_read ? '' : 'unread'}" data-n="${n.id}" data-r="${n.report_id || ''}" data-s="${n.skl_id || ''}">${esc(n.message)}<small>${fmtTs(n.created_at)}</small></div>`).join('') : '<div class="empty">Belum ada notifikasi</div>'}</div>`;
}
$('#bell').addEventListener('click', async (e) => {
  e.stopPropagation();
  const p = $('#notifPanel');
  if (!p.hidden) { p.hidden = true; return; }
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  await pollNotif(true); renderNotif(); p.hidden = false;
});
$('#notifPanel').addEventListener('click', async (e) => {
  e.stopPropagation();
  if (e.target.closest('#nAll')) { await api('/api/notifications/read', { json: {} }); pollNotif(true); return; }
  const it = e.target.closest('.nitem'); if (!it) return;
  api('/api/notifications/read', { json: { id: Number(it.dataset.n) } }).then(() => pollNotif(true)).catch(() => {});
  $('#notifPanel').hidden = true;
  if (it.dataset.s) openSklDetail(it.dataset.s);
  else if (it.dataset.r) openDetail(it.dataset.r);
});
document.addEventListener('click', () => { $('#notifPanel').hidden = true; });

/* =====================================================================
   Sidebar, login, logout, ganti password
   ===================================================================== */
$('#burger').addEventListener('click', () => {
  if (innerWidth <= 768) document.body.classList.toggle('sb-open');
  else if (innerWidth <= 1024) document.body.classList.toggle('sb-open-wide');
  else document.body.classList.toggle('collapsed');
});
$('#backdrop').addEventListener('click', () => document.body.classList.remove('sb-open'));
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true;
  try {
    const r = await api('/api/auth/login', { json: { username: $('#lu').value.trim(), password: $('#lp').value } });
    $('#lp').value = ''; location.hash = '#/dashboard';
    await startApp(r.user);
  } catch (er) { showError(er, 'Login gagal'); }
  finally { btn.disabled = false; }
});
$('#btnOut').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST', json: {} }).catch(() => {});
  S.user = null; closeModal(); showLogin();
});
$('#btnPass').addEventListener('click', async () => {
  const r = await Swal.fire({ title: 'Ganti password', showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', focusConfirm: false,
    html: `<div class="sw-form"><label>Password saat ini</label><input id="pw0" type="password" class="swal2-input inp" autocomplete="current-password" style="margin:0">
      <label>Password baru (min 6 karakter)</label><input id="pw1" type="password" class="swal2-input inp" autocomplete="new-password" style="margin:0">
      <label>Ulangi password baru</label><input id="pw2" type="password" class="swal2-input inp" autocomplete="new-password" style="margin:0"></div>`,
    preConfirm: () => {
      const a = $('#pw0').value, b = $('#pw1').value, c = $('#pw2').value;
      if (!a || b.length < 6) return Swal.showValidationMessage('Isi semua kolom; password baru minimal 6 karakter');
      if (b !== c) return Swal.showValidationMessage('Konfirmasi password tidak sama');
      return { current: a, next: b };
    } });
  if (!r.isConfirmed) return;
  try { await api('/api/auth/password', { json: r.value }); toast('success', 'Password berhasil diganti'); } catch (e) { showError(e); }
});

/* ---------- lupa password & reset lewat tautan ---------- */
$('#forgot').addEventListener('click', async (e) => {
  e.preventDefault();
  const r = await Swal.fire({ title: 'Lupa password', text: 'Masukkan username (NRP). Tautan reset akan dikirim ke WhatsApp/email yang terdaftar.', input: 'text', inputPlaceholder: 'Username (NRP)',
    showCancelButton: true, confirmButtonText: 'Kirim tautan', cancelButtonText: 'Batal', confirmButtonColor: '#1E3A8A', inputValue: $('#lu').value.trim(),
    inputValidator: (v) => (!v.trim() ? 'Username wajib diisi' : undefined) });
  if (!r.isConfirmed) return;
  try { const d = await api('/api/auth/forgot', { json: { username: r.value.trim() } }); Swal.fire({ icon: 'info', title: 'Permintaan diterima', text: d.message, confirmButtonColor: '#1E3A8A' }); }
  catch (er) { showError(er); }
});
/** Bila URL berbentuk #/reset/<token>: tampilkan form password baru (token langsung dihapus dari URL). */
async function handleReset() {
  const m = location.hash.match(/^#\/reset\/([A-Za-z0-9_-]+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname);
  showLogin();
  const r = await Swal.fire({ title: 'Buat password baru', allowOutsideClick: false, showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', confirmButtonColor: '#1E3A8A', focusConfirm: false,
    html: `<div class="sw-form"><label>Password baru (min 6 karakter)</label><input id="rp1" type="password" class="swal2-input inp" autocomplete="new-password" style="margin:0">
      <label>Ulangi password baru</label><input id="rp2" type="password" class="swal2-input inp" autocomplete="new-password" style="margin:0"></div>`,
    preConfirm: () => {
      const a = $('#rp1').value, b = $('#rp2').value;
      if (a.length < 6) return Swal.showValidationMessage('Password minimal 6 karakter');
      if (a !== b) return Swal.showValidationMessage('Konfirmasi password tidak sama');
      return a;
    } });
  if (r.isConfirmed) {
    try { await api('/api/auth/reset', { json: { token: m[1], password: r.value } }); await Swal.fire({ icon: 'success', title: 'Password berhasil diganti', text: 'Silakan login dengan password baru.', confirmButtonColor: '#1E3A8A' }); }
    catch (er) { showError(er, 'Reset gagal'); }
  }
  return true;
}

/* ---------- start ---------- */
(async () => {
  if (await handleReset()) return;
  try { const r = await api('/api/auth/me'); await startApp(r.user); }
  catch { showLogin(); }
})();
</script>
